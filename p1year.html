<!-- Miliani A. Reza, Jashea Alexis, Noa Shellim -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Calendar - Year View</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1 class="calendar-title">2026 Calendar</h1>
            </div>
            <div class="header-center">
                <button class="view-selector" id="viewSelector">Year/Month/Week/Day</button>
                <nav class="view-menu" id="viewMenu">
                    <a href="p1year.html" class="view-nav-link">Year</a>
                    <a href="p2month.html" class="view-nav-link">Month</a>
                    <a href="p3week.html" class="view-nav-link">Week</a>
                    <a href="p4day.html" class="view-nav-link">Day</a>
                </nav>
            </div>
            <div class="header-right">
                <button class="customize-btn">Customize</button>
                <button class="search-btn" id="searchBtn" aria-label="Search">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
                <div class="add-menu-container">
                    <button class="add-btn" id="addBtn" aria-label="Add">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                    <div class="add-menu" id="addMenu">
                        <button class="menu-item" onclick="handleAddTasks()">Add Tasks</button>
                        <button class="menu-item" onclick="handleAddReminders()">Add Reminders</button>
                        <button class="menu-item" onclick="handleAddCollaborators()">Add Collaborators</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="main-content">
            <!-- Calendar Grid -->
            <main class="calendar-grid">
                <div class="month-card" data-month="january" onclick="navigateToMonth('january')">
                    <div class="month-header">January</div>
                    <div class="month-content"></div>
                </div>
                <div class="month-card" data-month="february" onclick="navigateToMonth('february')">
                    <div class="month-header">February</div>
                    <div class="month-content"></div>
                </div>
                <div class="month-card" data-month="march" onclick="navigateToMonth('march')">
                    <div class="month-header">March</div>
                    <div class="month-content"></div>
                </div>
                <div class="month-card" data-month="april" onclick="navigateToMonth('april')">
                    <div class="month-header">April</div>
                    <div class="month-content"></div>
                </div>
                <div class="month-card" data-month="may" onclick="navigateToMonth('may')">
                    <div class="month-header">May</div>
                    <div class="month-content"></div>
                </div>
                <div class="month-card" data-month="june" onclick="navigateToMonth('june')">
                    <div class="month-header">June</div>
                    <div class="month-content"></div>
                </div>
                <div class="month-card" data-month="july" onclick="navigateToMonth('july')">
                    <div class="month-header">July</div>
                    <div class="month-content"></div>
                </div>
                <div class="month-card" data-month="august" onclick="navigateToMonth('august')">
                    <div class="month-header">August</div>
                    <div class="month-content"></div>
                </div>
                <div class="month-card" data-month="september" onclick="navigateToMonth('september')">
                    <div class="month-header">September</div>
                    <div class="month-content"></div>
                </div>
                <div class="month-card" data-month="october" onclick="navigateToMonth('october')">
                    <div class="month-header">October</div>
                    <div class="month-content"></div>
                </div>
                <div class="month-card" data-month="november" onclick="navigateToMonth('november')">
                    <div class="month-header">November</div>
                    <div class="month-content"></div>
                </div>
                <div class="month-card" data-month="december" onclick="navigateToMonth('december')">
                    <div class="month-header">December</div>
                    <div class="month-content"></div>
                </div>
            </main>

            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="collaborators-section">
                    <h2 class="collaborators-title">Collaborators</h2>
                    <div class="collaborators-list">
                        <p>milreza@ttu.edu</p>
                        <p>jalexis@ttu.edu</p>
                        <p>nshellim@ttu.edu</p>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Search Modal -->
    <div class="search-modal" id="searchModal">
        <div class="search-modal-content">
            <div class="search-modal-header">
                <h2>Search Events</h2>
                <button class="search-modal-close" id="closeSearchBtn" aria-label="Close">&times;</button>
            </div>
            <div class="search-modal-body">
                <input type="text" id="searchInput" class="search-input" placeholder="Search for events, tasks, reminders...">
                <div class="search-results" id="searchResults">
                    <p class="search-placeholder">Enter a search term to find events</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Tasks Modal -->
    <div class="add-modal" id="addTasksModal">
        <div class="add-modal-content">
            <div class="add-modal-header">
                <h2>Add Task</h2>
                <button class="add-modal-close" onclick="closeAddTasksModal()" aria-label="Close">&times;</button>
            </div>
            <div class="add-modal-body">
                <form id="taskForm" onsubmit="submitTask(event)">
                    <div class="form-group">
                        <label for="taskTitle">Task Title:</label>
                        <input type="text" id="taskTitle" name="taskTitle" placeholder="Enter task title" required>
                    </div>
                    <div class="form-group">
                        <label for="taskDate">Date:</label>
                        <input type="date" id="taskDate" name="taskDate" required>
                    </div>
                    <div class="form-group">
                        <label for="taskDescription">Description:</label>
                        <textarea id="taskDescription" name="taskDescription" placeholder="Enter task description" rows="4"></textarea>
                    </div>
                    <button type="submit" class="form-submit-btn">Add Task</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Add Reminders Modal -->
    <div class="add-modal" id="addRemindersModal">
        <div class="add-modal-content">
            <div class="add-modal-header">
                <h2>Add Reminder</h2>
                <button class="add-modal-close" onclick="closeAddRemindersModal()" aria-label="Close">&times;</button>
            </div>
            <div class="add-modal-body">
                <form id="reminderForm" onsubmit="submitReminder(event)">
                    <div class="form-group">
                        <label for="reminderTitle">Reminder Title:</label>
                        <input type="text" id="reminderTitle" name="reminderTitle" placeholder="Enter reminder title" required>
                    </div>
                    <div class="form-group">
                        <label for="reminderDateTime">Date & Time:</label>
                        <input type="datetime-local" id="reminderDateTime" name="reminderDateTime" required>
                    </div>
                    <div class="form-group">
                        <label for="reminderType">Reminder Type:</label>
                        <select id="reminderType" name="reminderType" required>
                            <option value="">Select type...</option>
                            <option value="email">Email</option>
                            <option value="notification">Notification</option>
                            <option value="sms">SMS</option>
                        </select>
                    </div>
                    <button type="submit" class="form-submit-btn">Add Reminder</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Add Collaborators Modal -->
    <div class="add-modal" id="addCollaboratorsModal">
        <div class="add-modal-content">
            <div class="add-modal-header">
                <h2>Add Collaborator</h2>
                <button class="add-modal-close" onclick="closeAddCollaboratorsModal()" aria-label="Close">&times;</button>
            </div>
            <div class="add-modal-body">
                <form id="collaboratorForm" onsubmit="submitCollaborator(event)">
                    <div class="form-group">
                        <label for="collaboratorEmail">Email Address:</label>
                        <input type="email" id="collaboratorEmail" name="collaboratorEmail" placeholder="Enter collaborator email" required>
                    </div>
                    <div class="form-group">
                        <label for="collaboratorName">Name:</label>
                        <input type="text" id="collaboratorName" name="collaboratorName" placeholder="Enter collaborator name" required>
                    </div>
                    <div class="form-group">
                        <label for="collaboratorRole">Role:</label>
                        <select id="collaboratorRole" name="collaboratorRole" required>
                            <option value="">Select role...</option>
                            <option value="viewer">Viewer</option>
                            <option value="editor">Editor</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="form-submit-btn">Add Collaborator</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
